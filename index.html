<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MİHENK — altın, gümüş ve halka arz karar masası</title>
<meta name="description" content="Altın, gümüş ve halka arzlar için her gün güncellenen veri ve karar analizi. Destek/direnç, kademeli giriş planı, halka arz puanlaması.">
<meta name="theme-color" content="#0e1012">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230e1012'/><path d='M28 74 L52 26' stroke='%23e0b25c' stroke-width='13' stroke-linecap='round'/><path d='M52 74 L70 38' stroke='%23c3cad3' stroke-width='9' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ——— MİHENK: mihenk taşı, altının ayarını sürtünce anlaşılan siyah taş.
   Zemin o taşın grafiti; altın ve gümüş sadece vurgu olarak kullanılır. ——— */
:root{
  --zemin:#0e1012; --kat1:#15181c; --kat2:#1c2026; --kat3:#242931;
  --cizgi:#282e35; --cizgiAcik:#333a43;
  --metin:#e9e7e2; --soluk:#949ca6; --cokSoluk:#666e78;
  --altin:#e0b25c; --altinKoyu:#a87b2c; --altinSis:rgba(224,178,92,.12);
  --gumus:#c3cad3; --gumusKoyu:#7d868f; --gumusSis:rgba(195,202,211,.10);
  --yesil:#4fa87c; --yesilSis:rgba(79,168,124,.13);
  --kirmizi:#d4594f; --kirmiziSis:rgba(212,89,79,.13);
  --sari:#d9a441;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:12px; --gecis:.18s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--zemin);color:var(--metin);
  font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 15% -8%,rgba(224,178,92,.055),transparent 65%),
                   radial-gradient(700px 400px at 92% 4%,rgba(195,202,211,.035),transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em;line-height:1.25}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ——— Kabuk ——— */
.kap{max-width:1120px;margin:0 auto;padding:0 20px}
header.ust{border-bottom:1px solid var(--cizgi);background:rgba(14,16,18,.82);backdrop-filter:blur(14px);position:sticky;top:0;z-index:50}
.ustIc{display:flex;align-items:center;gap:18px;padding:13px 0;flex-wrap:wrap}
.marka{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
.markaIz{width:26px;height:30px;flex-shrink:0}
.markaAd{font:700 19px/1 var(--sans);letter-spacing:.12em}
.markaAlt{font-size:10.5px;color:var(--cokSoluk);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.ustSag{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--soluk)}
.nabiz{width:7px;height:7px;border-radius:50%;background:var(--yesil);box-shadow:0 0 0 0 rgba(79,168,124,.6);animation:nb 2.4s infinite}
@keyframes nb{0%{box-shadow:0 0 0 0 rgba(79,168,124,.5)}70%{box-shadow:0 0 0 7px rgba(79,168,124,0)}100%{box-shadow:0 0 0 0 rgba(79,168,124,0)}}

/* ——— Sekmeler: dörtten fazla yok ——— */
nav.sekmeler{display:flex;gap:2px;border-bottom:1px solid var(--cizgi);overflow-x:auto;scrollbar-width:none}
nav.sekmeler::-webkit-scrollbar{display:none}
.sekme{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--soluk);font:500 14px var(--sans);padding:13px 16px;cursor:pointer;
  white-space:nowrap;transition:var(--gecis);letter-spacing:.01em;
}
.sekme:hover{color:var(--metin)}
.sekme[aria-selected=true]{color:var(--metin);border-bottom-color:var(--altin)}
.sekme .nokta{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--altin);margin-left:7px;vertical-align:middle}

main{padding:26px 0 70px;min-height:60vh}
.panel[hidden]{display:none}
section+section{margin-top:26px}
.baslikSatir{display:flex;align-items:baseline;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.baslikSatir h2{font-size:16px;letter-spacing:.02em}
.baslikSatir .not{font-size:12.5px;color:var(--cokSoluk)}

/* ——— Kartlar ——— */
.kart{background:var(--kat1);border:1px solid var(--cizgi);border-radius:var(--r);padding:18px}
.kart+.kart{margin-top:14px}
.izgara{display:grid;gap:14px}
/* Izgara/esnek çocuklarda varsayılan min-width:auto, uzun metinlerin kutuyu
   şişirip sayfayı yatay kaydırmasına yol açar; sıfırlanınca ellipsis çalışır. */
.izgara>*{min-width:0}
.i2{grid-template-columns:repeat(2,1fr)}
.i3{grid-template-columns:repeat(3,1fr)}
.i4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.i3,.i4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.i2,.i3,.i4{grid-template-columns:1fr}}

/* ——— Fiyat şeridi ——— */
.serit{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--cizgi);border:1px solid var(--cizgi);border-radius:var(--r);overflow:hidden}
@media(max-width:760px){.serit{grid-template-columns:repeat(2,1fr)}}
.seritHucre{background:var(--kat1);padding:13px 15px}
.seritAd{font-size:11px;color:var(--cokSoluk);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.seritDeger{font:600 19px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.seritAlt{font-size:11.5px;margin-top:4px;font-family:var(--mono)}

/* ——— Karar kartı: sol kenardaki "iz" hükmün rengini taşır ——— */
.karar{position:relative;padding-left:22px}
.karar::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:3px;background:var(--cokSoluk)}
.karar.al::before,.karar.kademeli::before,.karar.katil::before{background:linear-gradient(180deg,var(--altin),var(--altinKoyu))}
.karar.bekle::before,.karar.notr::before{background:linear-gradient(180deg,var(--gumus),var(--gumusKoyu))}
.karar.azalt::before,.karar.uzakDur::before{background:linear-gradient(180deg,var(--kirmizi),#8e332c)}
.kararEtiket{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cokSoluk);margin-bottom:7px}
.kararBaslik{font-size:17px;font-weight:600;margin-bottom:9px}
.kararGerekce{font-size:14px;color:var(--soluk);line-height:1.62}

/* ——— Rozetler ——— */
.rozet{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--sans);padding:3px 9px;border-radius:20px;border:1px solid var(--cizgiAcik);color:var(--soluk);white-space:nowrap}
.rozet.iyi{color:var(--yesil);border-color:rgba(79,168,124,.35);background:var(--yesilSis)}
.rozet.kotu{color:var(--kirmizi);border-color:rgba(212,89,79,.35);background:var(--kirmiziSis)}
.rozet.altin{color:var(--altin);border-color:rgba(224,178,92,.35);background:var(--altinSis)}
.rozet.gumus{color:var(--gumus);border-color:rgba(195,202,211,.28);background:var(--gumusSis)}
.arti{color:var(--yesil)}.eksi{color:var(--kirmizi)}.notr{color:var(--soluk)}

/* ——— Tablolar ——— */
.tabloKutu{overflow-x:auto;border:1px solid var(--cizgi);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--cokSoluk);padding:10px 13px;background:var(--kat2);border-bottom:1px solid var(--cizgi);white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid var(--cizgi);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--kat2)}
td.say,th.say{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.kod{font:600 12.5px var(--mono);letter-spacing:.03em}

/* ——— Ölçüt / kanıt satırı ——— */
.olcut{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--cizgi);align-items:flex-start}
.olcut:last-child{border-bottom:0}
.olcutIz{width:3px;align-self:stretch;border-radius:2px;background:var(--cokSoluk);flex-shrink:0;min-height:34px}
.olcut.olumlu .olcutIz{background:var(--yesil)}
.olcut.olumsuz .olcutIz{background:var(--kirmizi)}
.olcutAd{font-size:13px;font-weight:600;margin-bottom:2px}
.olcutDeger{font-size:12.5px;color:var(--altin);font-family:var(--mono);margin-bottom:4px}
.olcutMetin{font-size:12.5px;color:var(--soluk);line-height:1.55}

/* ——— Kademe planı ——— */
.kademe{display:flex;align-items:center;gap:13px;padding:12px 14px;background:var(--kat2);border:1px solid var(--cizgi);border-radius:9px}
.kademe+.kademe{margin-top:8px}
.kademePay{font:700 15px var(--mono);color:var(--altin);min-width:46px}
.kademeFiyat{font:600 15px var(--mono)}
.kademeAd{font-size:12.5px;color:var(--soluk);margin-left:auto;text-align:right}

/* ——— Grafik ——— */
.grafikKutu{position:relative;background:var(--kat1);border:1px solid var(--cizgi);border-radius:var(--r);padding:14px}
svg.grafik{display:block;width:100%;height:auto;overflow:visible}
.seviyeEtiket{font:500 10px var(--mono);fill:var(--cokSoluk)}

/* ——— Sinyal listesi ——— */
.sinyal{display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 0}
.sinyalIkon{width:16px;height:16px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700}
.sinyal.e .sinyalIkon{background:var(--yesilSis);color:var(--yesil)}
.sinyal.h .sinyalIkon{background:var(--kirmiziSis);color:var(--kirmizi)}
.sinyalAgirlik{margin-left:auto;font:500 11px var(--mono);color:var(--cokSoluk)}

/* ——— Ölçek çubuğu (puan) ——— */
.puanKutu{display:flex;align-items:center;gap:14px}
.puanSayi{font:700 34px/1 var(--mono)}
.puanCubuk{flex:1;height:7px;background:var(--kat3);border-radius:4px;overflow:hidden;position:relative}
.puanDolgu{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--kirmizi),var(--sari) 50%,var(--yesil));transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ——— Haber ——— */
.haber{display:block;text-decoration:none;padding:11px 0;border-bottom:1px solid var(--cizgi)}
.haber:last-child{border-bottom:0}
.haber:hover .haberBaslik{color:var(--altin)}
.haberBaslik{font-size:13.5px;line-height:1.48;transition:var(--gecis)}
.haberAlt{font-size:11.5px;color:var(--cokSoluk);margin-top:4px;display:flex;gap:9px}

/* ——— Açılır bölüm ——— */
details.katla{border:1px solid var(--cizgi);border-radius:var(--r);background:var(--kat1);overflow:hidden}
details.katla+details.katla{margin-top:10px}
details.katla>summary{padding:14px 18px;cursor:pointer;font-size:14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:11px}
details.katla>summary::-webkit-details-marker{display:none}
details.katla>summary::after{content:'+';margin-left:auto;color:var(--cokSoluk);font:400 17px var(--mono)}
details.katla[open]>summary::after{content:'−'}
details.katla>summary:hover{background:var(--kat2)}
.katlaIc{padding:0 18px 18px;border-top:1px solid var(--cizgi);padding-top:16px}

/* ——— Düğmeler: satır başına en fazla iki nötr ——— */
.dugme{appearance:none;background:var(--kat2);border:1px solid var(--cizgiAcik);color:var(--metin);font:500 13px var(--sans);padding:8px 15px;border-radius:8px;cursor:pointer;transition:var(--gecis)}
.dugme:hover{background:var(--kat3);border-color:var(--soluk)}
.dugme[aria-pressed=true]{background:var(--altinSis);border-color:var(--altinKoyu);color:var(--altin)}
.dugme.ana{background:linear-gradient(180deg,var(--altin),var(--altinKoyu));border-color:var(--altinKoyu);color:#1a1408;font-weight:600}
.dugme.ana:hover{filter:brightness(1.08)}
.dugmeSira{display:flex;gap:9px;flex-wrap:wrap}

/* ——— Uyarı / dipnot ——— */
.uyari{background:var(--kirmiziSis);border:1px solid rgba(212,89,79,.3);border-radius:9px;padding:12px 15px;font-size:13px;color:var(--metin)}
.kaynakNot{font-size:11.5px;color:var(--cokSoluk);line-height:1.6}
footer{border-top:1px solid var(--cizgi);margin-top:50px;padding:26px 0 40px;font-size:12px;color:var(--cokSoluk);line-height:1.7}
.yukleniyor{text-align:center;padding:70px 20px;color:var(--soluk)}
.donuyor{width:26px;height:26px;border:2px solid var(--cizgiAcik);border-top-color:var(--altin);border-radius:50%;animation:dn .8s linear infinite;margin:0 auto 14px}
@keyframes dn{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="ust">
  <div class="kap">
    <div class="ustIc">
      <a class="marka" href="#" onclick="return false">
        <svg class="markaIz" viewBox="0 0 26 30" aria-hidden="true">
          <rect width="26" height="30" rx="5" fill="#191d22"/>
          <path d="M7 23 L13 8" stroke="#e0b25c" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M13.5 23 L18 12" stroke="#c3cad3" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="markaAd">MİHENK</div>
          <div class="markaAlt">altın · gümüş · halka arz</div>
        </div>
      </a>
      <div class="ustSag">
        <span class="nabiz" id="nabiz" title="canlı"></span>
        <span id="guncelleme" class="mono">—</span>
      </div>
    </div>
    <nav class="sekmeler" role="tablist" id="sekmeler">
      <button class="sekme" role="tab" aria-selected="true" data-panel="bugun">Bugün</button>
      <button class="sekme" role="tab" aria-selected="false" data-panel="altin">Altın</button>
      <button class="sekme" role="tab" aria-selected="false" data-panel="gumus">Gümüş</button>
      <button class="sekme" role="tab" aria-selected="false" data-panel="arz">Halka Arz<span class="nokta" id="arzNokta" hidden></span></button>
    </nav>
  </div>
</header>

<main class="kap">
  <div id="yukleniyor" class="yukleniyor">
    <div class="donuyor"></div>
    Veriler yükleniyor…
  </div>
  <div id="panelBugun" class="panel" hidden></div>
  <div id="panelAltin" class="panel" hidden></div>
  <div id="panelGumus" class="panel" hidden></div>
  <div id="panelArz"   class="panel" hidden></div>
</main>

<footer>
  <div class="kap" id="altbilgi"></div>
</footer>

<script src="uygulama.js"></script>
</body>
</html>
